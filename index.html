<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevOps Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    min-height: 100vh;
    padding: 30px;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 32px;
    font-weight: 600;
}

.header p {
    color: #94a3b8;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 20px;
    transition: 0.3s;
    border: 1px solid rgba(255,255,255,0.1);
}

.card:hover {
    transform: translateY(-5px);
}

/* STATUS COLORS */
.success { color: #22c55e; }
.failed { color: #ef4444; }
.running { color: #facc15; }

/* SECTION TITLE */
.section-title {
    margin: 25px 0 10px;
    font-size: 18px;
    color: #cbd5f5;
}

/* PIPELINE */
.pipeline-stage {
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
}

/* DOCKER */
.container-box {
    padding: 10px;
    margin: 5px 0;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
}

/* FOOTER */
.footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: #64748b;
}
</style>
</head>

<body>

<div class="header">
    <h1>🚀 DevOps Dashboard</h1>
    <p>Jenkins • Docker • CI/CD Monitoring</p>
</div>

<div class="grid">
    <div class="card">
        <h3>Build Status</h3>
        <p id="status" class="running">Loading...</p>
        <small id="buildNumber"></small>
    </div>

    <div class="card">
        <h3>Deployment</h3>
        <p class="success">Auto CI/CD</p>
    </div>

    <div class="card">
        <h3>Server</h3>
        <p class="success">Running</p>
    </div>
</div>

<div class="section-title">⚙️ Pipeline Stages</div>
<div id="pipeline"></div>

<div class="section-title">🐳 Docker Containers</div>
<div id="docker"></div>

<div class="footer">
    Built with ❤️ using Jenkins & Docker
</div>

<script>
const API = "http://localhost:5000";

// STATUS
async function getStatus() {
    try {
        const res = await fetch(`${API}/jenkins/status`);
        const data = await res.json();

        let status = "RUNNING";
        let className = "running";

        if (data.result === "SUCCESS") {
            status = "SUCCESS";
            className = "success";
        } else if (data.result === "FAILURE") {
            status = "FAILED";
            className = "failed";
        }

        document.getElementById("status").innerText = status;
        document.getElementById("status").className = className;
        document.getElementById("buildNumber").innerText = "Build #" + data.number;

    } catch {
        document.getElementById("status").innerText = "OFFLINE";
    }
}

// PIPELINE
async function getPipeline() {
    try {
        const res = await fetch(`${API}/jenkins/pipeline`);
        const data = await res.json();

        let html = "";

        data.stages.forEach(stage => {
            let cls = "running";
            if (stage.status === "SUCCESS") cls = "success";
            if (stage.status === "FAILED") cls = "failed";

            html += `
                <div class="pipeline-stage ${cls}">
                    ${stage.name} - ${stage.status}
                </div>
            `;
        });

        document.getElementById("pipeline").innerHTML = html;

    } catch {
        document.getElementById("pipeline").innerText = "No data";
    }
}

// DOCKER
async function getDocker() {
    try {
        const res = await fetch(`${API}/docker`);
        const data = await res.json();

        let html = "";

        data.forEach(c => {
            html += `
                <div class="container-box">
                    ${c.Names} - ${c.Status}
                </div>
            `;
        });

        document.getElementById("docker").innerHTML = html;

    } catch {
        document.getElementById("docker").innerText = "Docker not available";
    }
}

// REFRESH
setInterval(() => {
    getStatus();
    getPipeline();
    getDocker();
}, 5000);

getStatus();
getPipeline();
getDocker();
</script>

</body>
</html>
