<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Jenkins Dashboard</title>

<link rel="icon" href="data:,">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 900px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

h1 { text-align: center; margin-bottom: 10px; }
.subtitle { text-align: center; margin-bottom: 25px; color: gray; }

.status {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: #f5f5f5;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
}

.card h3 { margin-bottom: 10px; }

.links {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.btn {
    padding: 10px;
    text-align: center;
    background: #667eea;
    color: white;
    border-radius: 5px;
    text-decoration: none;
}

.btn:hover { background: #764ba2; }

.console {
    background: black;
    color: #00ff00;
    padding: 10px;
    height: 200px;
    overflow-y: auto;
    font-size: 12px;
    border-radius: 5px;
}

</style>
</head>

<body>

<div class="container">
    <h1>🚀 DevOps CI/CD Dashboard</h1>
    <p class="subtitle">Jenkins + Docker + GitHub Integration</p>

    <div class="status">
        <div class="card">
            <h3>Build Status</h3>
            <p id="status">Loading...</p>
            <small id="buildNumber"></small><br>
            <small id="buildTime"></small>
        </div>

        <div class="card">
            <h3>Deployment</h3>
            <p>Auto CI/CD</p>
        </div>

        <div class="card">
            <h3>Server</h3>
            <p style="color:green;">Running</p>
        </div>
    </div>

    <div class="links">
        <a href="http://localhost:8080" target="_blank" class="btn">Jenkins Dashboard</a>
        <a href="http://localhost:8080/job/devops-project" target="_blank" class="btn">Pipeline</a>
        <a href="https://github.com/SUJITH-NS/devrewjen" target="_blank" class="btn">GitHub Repo</a>
    </div>

    <h3>📊 Live Console Output</h3>
    <div class="console" id="console">Loading logs...</div>

</div>

<script>
const JENKINS_URL = "http://localhost:8080";
const JOB_NAME = "devops-project";

async function getStatus() {
    try {
        const res = await fetch(`${JENKINS_URL}/job/${JOB_NAME}/api/json`);
        const data = await res.json();

        const build = data.lastBuild;
        const result = build.result;

        let statusText = "BUILDING...";
        let color = "orange";

        if (result === "SUCCESS") {
            statusText = "🟢 SUCCESS";
            color = "green";
        } else if (result === "FAILURE") {
            statusText = "🔴 FAILED";
            color = "red";
        }

        document.getElementById("status").innerHTML = statusText;
        document.getElementById("status").style.color = color;
        document.getElementById("buildNumber").innerHTML = "Build #" + build.number;
        document.getElementById("buildTime").innerHTML =
            new Date(build.timestamp).toLocaleString();

    } catch {
        document.getElementById("status").innerHTML = "⚠️ Jenkins Offline";
    }
}

async function getLogs() {
    try {
        const res = await fetch(`${JENKINS_URL}/job/${JOB_NAME}/lastBuild/consoleText`);
        const text = await res.text();

        document.getElementById("console").innerText =
            text.slice(-2000);
    } catch {
        document.getElementById("console").innerText = "⚠️ Unable to fetch logs";
    }
}

setInterval(getStatus, 5000);
setInterval(getLogs, 5000);

getStatus();
getLogs();
</script>

</body>
</html>
